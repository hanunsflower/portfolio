<!DOCTYPE html>
<html lang="en">
<head>
<script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('js')</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reyhana Hamza | Full Stack Developer</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f0ff;--ink:#1d1038;--muted:#5b4d7a;--line:#ddd2f5;--card:#fff;--violet:#6a3dff;--pink:#ff6fa5;--mint:#1fb98f;--sun:#ffc83d;--chip:#ebe3ff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150d28;--ink:#f3eeff;--muted:#b5a8d6;--line:#2f2250;--card:#1e1438;--chip:#2a1d4d}}
:root[data-theme="dark"]{--bg:#150d28;--ink:#f3eeff;--muted:#b5a8d6;--line:#2f2250;--card:#1e1438;--chip:#2a1d4d}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Outfit",system-ui,sans-serif;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.top{display:flex;justify-content:space-between;align-items:center;padding:24px 0}
.top b{font:800 22px "Fraunces",serif}
nav a{margin-left:22px;text-decoration:none;color:var(--muted);font-weight:500}
nav a:hover{color:var(--ink)}
.hero{display:grid;gap:56px;align-items:center;padding:32px 0 104px}
@media(min-width:840px){.hero{grid-template-columns:1.2fr 1fr}}
.role{display:inline-block;background:var(--ink);color:var(--bg);padding:6px 16px;border-radius:999px;font-weight:500;font-size:15px;margin-bottom:22px}
.hero h1{font:800 clamp(54px,10vw,112px)/.95 "Fraunces",serif;letter-spacing:-.035em;margin:0 0 24px}
.hero h1 span{color:var(--violet)}
.hero p{max-width:30em;font-size:20px;color:var(--muted);margin:0 0 32px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:14px 26px;border-radius:999px;text-decoration:none;font-weight:600;border:2px solid var(--ink)}
.btn.primary{background:var(--violet);color:#fff;border-color:var(--violet)}
.btn:hover{transform:translateY(-2px)}
@media(prefers-reduced-motion:no-preference){.btn{transition:transform .15s}}
.photo{position:relative;max-width:360px;width:100%;margin:0 auto;aspect-ratio:9/10}
.photo::before{content:"";position:absolute;inset:0;border-radius:999px 999px 28px 28px;background:var(--pink);transform:translate(14px,14px)}
.photo .frame{position:relative;width:100%;height:100%;border-radius:999px 999px 28px 28px;overflow:hidden;background:var(--chip);border:4px solid var(--ink);display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
.photo .frame svg{width:90px;height:90px;display:block;margin:0 auto 8px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.chip{position:absolute;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:6px 16px;font-weight:600;font-size:15px;z-index:2}
.c1{left:-30px;top:22%}
.c2{right:-26px;top:48%;background:var(--sun);color:#1d1038}
.c3{left:-14px;bottom:10%;background:var(--mint);color:#06281f}
section{padding:80px 0}
h2{font:800 clamp(36px,6vw,60px)/1 "Fraunces",serif;letter-spacing:-.03em;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 44px;max-width:34em}
.grid{display:grid;gap:28px}
@media(min-width:840px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:2px solid var(--ink);border-radius:28px;overflow:hidden;display:flex;flex-direction:column}
.card svg,.card img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.card .body{padding:24px 26px 28px}
.card h3{font:800 27px/1.1 "Fraunces",serif;margin:0 0 10px;letter-spacing:-.01em}
.card p{margin:0 0 16px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tags span{background:var(--chip);padding:3px 13px;border-radius:999px;font-size:14px;font-weight:500}
.links a{margin-right:20px;font-weight:600}
.about{display:grid;gap:44px}
@media(min-width:840px){.about{grid-template-columns:1fr 1.1fr}}
.about p{color:var(--muted);margin:0 0 14px}
.skgroup{margin-bottom:22px}
.skgroup h3{font:600 16px "Outfit",sans-serif;color:var(--muted);margin:0 0 10px}
.skills{display:flex;flex-wrap:wrap;gap:10px}
.skills span{border:2px solid var(--ink);padding:7px 18px;border-radius:999px;font-weight:600}
.skills .v{background:var(--violet);color:#fff;border-color:var(--violet)}
.skills .p{background:var(--pink);color:#2a0618;border-color:var(--pink)}
.skills .s{background:var(--sun);color:#1d1038;border-color:var(--sun)}
.skills .m{background:var(--mint);color:#06281f;border-color:var(--mint)}
.contact{background:var(--violet);color:#fff;border-radius:36px;padding:64px 28px;text-align:center;margin-bottom:56px}
.contact h2{margin-bottom:14px}
.contact p{margin:0 0 10px}
.contact a{font-weight:600}

/* ---- motion ---- */
.wrap{position:relative;z-index:1}
.progress{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:4px;z-index:50;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--violet),var(--pink),var(--sun))}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(520px circle at var(--cx,50%) var(--cy,30%),rgba(106,61,255,.15),transparent 62%)}
@media (hover:none){.glow{display:none}}
nav a{padding-bottom:4px;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
nav a.active{color:var(--ink);border-bottom-color:var(--violet)}
.caret{display:inline-block;width:2px;height:1em;background:currentColor;margin-left:3px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
.role{min-width:3ch}
.photo::before,.photo .frame,.chip{transition:translate .25s ease-out}
.photo .frame{translate:calc(var(--mx,0)*1px) calc(var(--my,0)*1px)}
.photo::before{translate:calc(var(--mx,0)*-.8px) calc(var(--my,0)*-.8px)}
.chip{translate:calc(var(--mx,0)*1.6px) calc(var(--my,0)*1.6px)}
.card{transition:transform .18s ease-out,box-shadow .25s;will-change:transform}
.card:hover{box-shadow:0 26px 50px -20px rgba(106,61,255,.5)}
.card img,.card svg{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card:hover img,.card:hover svg{transform:scale(1.06)}
.skills span{transition:transform .2s,box-shadow .2s;cursor:default}
.skills span:hover{transform:translateY(-4px) scale(1.06);box-shadow:0 8px 16px -8px rgba(29,16,56,.5)}
@keyframes blink{50%{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-12px)}}
html.js .hero>div:first-child>*{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
html.js .hero>div:first-child>:nth-child(2){animation-delay:.1s}
html.js .hero>div:first-child>:nth-child(3){animation-delay:.2s}
html.js .hero>div:first-child>:nth-child(4){animation-delay:.3s}
html.js .photo{animation:up 1s .2s cubic-bezier(.2,.7,.2,1) both}
html.js .c1{animation:float 5s ease-in-out infinite}
html.js .c2{animation:float 6s -2s ease-in-out infinite}
html.js .c3{animation:float 5.5s -1s ease-in-out infinite}
html.js .reveal{opacity:0;transform:translateY(30px)}
html.js .reveal.in{opacity:1;transform:none;transition:opacity .7s ease,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
</style>
</head>
